name: Предложение / Feature request
description: Идея, как сделать программу удобнее / An idea to make the program better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Что сейчас неудобно / What is inconvenient now
      placeholder: В соревнованиях приходится … / In contests I have to …
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: Как это могло бы работать / How it could work
    validations: {required: true}
  - type: dropdown
    id: platform
    attributes:
      label: Где нужно / Where
      multiple: true
      options: [Android, macOS, Windows, Linux]
  - type: textarea
    id: context
    attributes:
      label: Дополнительно / Anything else
      description: Скриншоты других программ, ссылки на форматы и API / Screenshots of other programs, links to formats and APIs
